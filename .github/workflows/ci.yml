name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check

      - name: Test
        run: pnpm test

      # Prod audit is blocking; full-tree stays non-blocking for tooling-only vulns (e.g. eslint/monkey).
      - name: Audit (prod)
        run: pnpm audit --prod --audit-level=high

      - name: Audit (full tree, non-blocking)
        run: pnpm audit || true
        continue-on-error: true

      - name: Build
        run: pnpm build

      - name: Build demo site
        run: pnpm site:build
