name: Deploy demo site

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "site/**"
      - "scripts/flatten-site.mjs"
      - "vite.site.config.ts"
      - "svelte.config.js"
      - "tsconfig.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm site:build:static

      # Same direct-upload path as PR preview (npx wrangler; see preview.yml).
      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          LOG=$(mktemp)
          npx --yes wrangler@4 pages deploy dist-site \
            --project-name=portals-improved \
            --branch=main \
            --commit-hash="${{ github.sha }}" \
            --commit-dirty=true \
            | tee "$LOG"
          URLS=$(grep -oE 'https://[a-zA-Z0-9._-]+\.pages\.dev' "$LOG" | sort -u)
          URL=$(printf '%s\n' "$URLS" | grep -v '^https://pr-' | head -n1 || true)
          if [ -z "$URL" ]; then URL=$(printf '%s\n' "$URLS" | head -n1 || true); fi
          echo "deployment-url=$URL" >> "$GITHUB_OUTPUT"
          echo "Parsed URL=$URL"
          test -n "$URL"
