name: PR preview

on:
  pull_request:
    branches:
      - main
    # Skip docs/CI-only PRs — only deploy when the demo build inputs change.
    paths:
      - "src/**"
      - "site/**"
      - "scripts/flatten-site.mjs"
      - "vite.site.config.ts"
      - "svelte.config.js"
      - "tsconfig.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/preview.yml"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    # Fork PRs don't get repo secrets — skip rather than fail noisily.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build demo site
        run: pnpm site:build:static

      # Lockfile-pinned wrangler (devDependency); never floating wrangler@4 dist-tag.
      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          LOG=$(mktemp)
          pnpm exec wrangler pages deploy dist-site \
            --project-name=portals-improved \
            --branch="pr-${{ github.event.pull_request.number }}" \
            --commit-hash="${{ github.event.pull_request.head.sha }}" \
            --commit-dirty=true \
            | tee "$LOG"
          # Wrangler prints deployment + alias URLs; prefer the alias for PR sticky links.
          URLS=$(grep -oE 'https://[a-zA-Z0-9._-]+\.pages\.dev' "$LOG" | sort -u)
          URL=$(printf '%s\n' "$URLS" | grep -v '^https://pr-' | head -n1 || true)
          ALIAS=$(printf '%s\n' "$URLS" | grep '^https://pr-' | head -n1 || true)
          if [ -z "$URL" ]; then URL=$(printf '%s\n' "$URLS" | head -n1 || true); fi
          if [ -z "$ALIAS" ]; then ALIAS="$URL"; fi
          echo "deployment-url=$URL" >> "$GITHUB_OUTPUT"
          echo "pages-deployment-alias-url=$ALIAS" >> "$GITHUB_OUTPUT"
          echo "Parsed URL=$URL ALIAS=$ALIAS"
          test -n "$URL"

      - name: Comment preview URL
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: cloudflare-preview
          message: |
            ### Demo preview
            **PR alias:** ${{ steps.deploy.outputs.pages-deployment-alias-url }}
            **This commit:** ${{ steps.deploy.outputs.deployment-url }}

            Updated for `${{ github.event.pull_request.head.sha }}`.
