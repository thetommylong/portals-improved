name: PR preview

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    # Fork PRs don't get repo secrets — skip rather than fail noisily.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build demo site
        run: pnpm site:build:static

      # Use npx (not wrangler-action): this repo's pnpm setup ignores dependency
      # build scripts, and npm i into the workspace also fails peer resolution.
      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          JSON=$(npx --yes wrangler@4 pages deploy dist-site \
            --project-name=portals-improved \
            --branch="pr-${{ github.event.pull_request.number }}" \
            --commit-hash="${{ github.event.pull_request.head.sha }}" \
            --commit-dirty=true \
            --json)
          echo "$JSON"
          URL=$(echo "$JSON" | jq -r '.url // empty')
          ALIAS=$(echo "$JSON" | jq -r '(.alias // .aliases[0] // empty)')
          echo "deployment-url=$URL" >> "$GITHUB_OUTPUT"
          echo "pages-deployment-alias-url=$ALIAS" >> "$GITHUB_OUTPUT"
          test -n "$URL"

      - name: Comment preview URL
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          header: cloudflare-preview
          message: |
            ### Demo preview
            **PR alias:** ${{ steps.deploy.outputs.pages-deployment-alias-url }}
            **This commit:** ${{ steps.deploy.outputs.deployment-url }}

            Updated for `${{ github.event.pull_request.head.sha }}`.
